# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: datasette-cluster-map
  version: 0.19.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/datasette_cluster_map-${{ version }}.tar.gz
  sha256: 3b6294037982d41a05b18ee4785063efd7c1af001bd4af61e12b3a1fdc60946e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - datasette >=0.54
    - datasette-leaflet >=0.3
tests:
  - python:
      imports:
        - datasette_cluster_map
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Datasette plugin that shows a map for any data with latitude/longitude columns
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/simonw/datasette-cluster-map

extra:
  recipe-maintainers:
    - rxm7706
